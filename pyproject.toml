[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playout"
version = "0.1.0"
description = "Sealed-canon story simulation: actors, storyteller, steer, writer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic-ai-slim[openrouter]>=2.0.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
playout = "playout.__main__:main"

[tool.setuptools.packages.find]
include = ["playout*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
