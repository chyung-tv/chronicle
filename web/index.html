<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>演繹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="masthead">
    <div class="mast-title">
      <h1 id="title">演繹</h1>
      <p class="sub" id="clock"></p>
    </div>
    <div class="controls">
      <button id="btn-tick" type="button">演一步</button>
      <button id="btn-day" type="button">演完今日</button>
      <button id="btn-reset" type="button" class="ghost">重置世界</button>
      <span id="llm-mode" class="pill"></span>
    </div>
    <ol id="run-strip" class="run-strip" aria-label="今日跑序"></ol>
  </header>

  <main class="workspace">
    <section class="panel stage" aria-labelledby="stage-h">
      <h2 id="stage-h">鎮</h2>
      <svg id="map" viewBox="0 0 540 360" role="img" aria-label="鎮圖"></svg>
      <p class="weather" id="weather"></p>
    </section>

    <section class="panel chronicle" aria-labelledby="chron-h">
      <div class="tabs">
        <button type="button" data-tab="tape" class="on">事件帶</button>
        <button type="button" data-tab="chapters">章回</button>
      </div>
      <ol id="tape" class="tape tab-body"></ol>
      <div id="tab-chapters" class="tab-body hidden"></div>
    </section>

    <aside class="panel cast" aria-labelledby="cast-h">
      <h2 id="cast-h">人物</h2>
      <div id="cast-nav" class="cast-nav"></div>
      <div id="cast-sheet" class="cast-sheet"></div>
    </aside>
  </main>

  <footer class="god" aria-label="神諭">
    <p class="god-kicker">神諭 · 不改昨日</p>
    <form id="form-inject">
      <label>世界事件
        <input name="inject" placeholder="隕石擊中碼頭" autocomplete="off" />
      </label>
      <button type="submit">注入</button>
    </form>
    <form id="form-steer">
      <label>導引意圖
        <input name="steer" placeholder="關瑪應當毀了張渡" autocomplete="off" />
      </label>
      <button type="submit">導引</button>
    </form>
    <div id="god-intents" class="god-intents"></div>
    <p class="hint">正史已封。你可以改明日，不能改昨日。導引只造動機與壓力；人物仍自己選擇。對持中的回話算在發起者這一拍裡。</p>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
